<IfModule mod_proxy.c>
    ProxyPreserveHost On

    # Route WebSocket connections to internal Reverb server
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*) ws://127.0.0.1:8080/$1 [P,L]

    # Route Reverb HTTP API endpoints (for server-side broadcast dispatching)
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule ^/app/(.*) http://127.0.0.1:8080/app/$1 [P,L]
    RewriteRule ^/apps/(.*) http://127.0.0.1:8080/apps/$1 [P,L]
</IfModule>
