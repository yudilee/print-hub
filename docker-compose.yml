version: '3.8'

services:
  print-hub:
    build: .
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      print-hub-db:
        condition: service_healthy
    environment:
      - APP_NAME=PrintHub
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY:-base64:19hjIjrPouxH0sSc7OKp+Z7wjIYlDEWP5kfbYpKC7fY=}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://print-hub.hartonomotor-group.com}
      - DB_CONNECTION=pgsql
      - DB_HOST=print-hub-db
      - DB_PORT=5432
      - DB_DATABASE=printhub
      - DB_USERNAME=printhub
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=${REVERB_APP_ID:-100100}
      - REVERB_APP_KEY=${REVERB_APP_KEY:-printhub-live-key}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET:-printhub-live-secret}
      - REVERB_HOST=${REVERB_HOST:-print-hub.hartonomotor-group.com}
      - REVERB_PORT=${REVERB_PORT:-443}
      - REVERB_SCHEME=${REVERB_SCHEME:-https}
      - REVERB_SERVER_HOST=127.0.0.1
      - REVERB_SERVER_PORT=8080
    volumes:
      - print-hub-storage:/var/www/html/storage

  print-hub-db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=printhub
      - POSTGRES_USER=printhub
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      - print-hub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printhub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  print-hub-storage:
  print-hub-pgdata:
